# Server definition for the Docker MCP Toolkit.
# Add it to a profile with `mise run docker-register` (see README, section Docker MCP Toolkit).
name: duolingo
type: server
image: udondan/duolingo:latest
title: Duolingo
description: Duolingo profile, streak, courses, XP progress, friends, shop and more via the unofficial Duolingo API
secrets:
  - name: duolingo.username
    env: DUOLINGO_USERNAME
    example: your_duolingo_username
    description: Your Duolingo username
  - name: duolingo.jwt
    env: DUOLINGO_JWT
    example: your_jwt_token
    description: Your Duolingo JWT token (see README, section Getting Your JWT Token)
