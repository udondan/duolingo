[project]
name = "duolingo-mcp"
version = "0.1.0"
description = "Python MCP server for the unofficial Duolingo API"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "duolingo-api @ git+https://github.com/iSteve-O/Duolingo.git",
    "httpx>=0.27.0",
]

[project.scripts]
duolingo-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.hatch.metadata]
allow-direct-references = true
