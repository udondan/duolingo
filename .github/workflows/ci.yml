name: CI

on:
  pull_request:
    branches:
      - main
  # Codecov compares pull requests against the coverage of main.
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # All runs share one live Duolingo account. Many parallel runs, for
  # example of several Renovate PRs, would send bursts of requests that look
  # suspicious, so only one run at a time may run the integration tests,
  # including the runs on main.
  wait-for-turn:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: write # lock refs under refs/wait-for-turn/
      pull-requests: read # labels for label-weights
      statuses: write # queue position as commit status
    # A new commit on the branch cancels the waiting of the outdated run, so the
    # new run doesn't queue behind it. Once a run has the turn, this job is
    # done: test jobs that already run are never cancelled.
    concurrency:
      group: test-wait-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      # Queue order: manual PRs first, then Renovate updates, and main last.
      # A branch that is behind main is rebased and the run stops right away;
      # the rebased commit starts a new run. Branch protection requires PRs to
      # be up to date, so testing an outdated branch is wasted time. The rebase
      # needs OVERRIDE_TOKEN: pushes with github.token don't start new runs.
      - name: Wait for turn
        uses: udondan/wait-for-turn@5d5087178d139c5f6af28997dff9addf49738a86 # v1.7.1
        with:
          status-context: wait-for-turn
          require-up-to-date: true
          update-token: ${{ secrets.OVERRIDE_TOKEN }}
          label-weights: |
            renovate=-5
          no-pull-request-weight: -100

  ci:
    name: Lint, typecheck & test
    needs: wait-for-turn
    # Pull requests from forks can't take the turn and skip the wait, as they
    # don't get the secrets. Fail if the wait failed or was cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC

    steps:
      - name: Check turn
        if: needs.wait-for-turn.result == 'failure' || needs.wait-for-turn.result == 'cancelled'
        run: exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:coverage
        env:
          DUOLINGO_USERNAME: ${{ secrets.DUOLINGO_USERNAME }}
          DUOLINGO_JWT: ${{ secrets.DUOLINGO_JWT }}
          DUOLINGO_TEST_USERNAME: ${{ secrets.DUOLINGO_TEST_USERNAME }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: coverage/lcov.info

      - name: Package dry-run
        run: npm pack --dry-run

  actions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: actionlint shellcheck zizmor

      # Also runs shellcheck over every `run:` block.
      - name: actionlint
        run: actionlint

      - name: zizmor
        run: zizmor .
        env:
          GH_TOKEN: ${{ github.token }} # zizmor checks the actions online

  # Codecov reports its result as the check runs codecov/project and
  # codecov/patch. This job waits for them, so a coverage drop fails the
  # required job. It is skipped along with the tests and passes with a warning
  # if Codecov doesn't report in time.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.event_name == 'pull_request' && needs.ci.result == 'success'
    timeout-minutes: 10
    permissions:
      checks: read
    steps:
      - name: Wait for Codecov
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 30); do
            checks=$(gh api --paginate --slurp "repos/$REPO/commits/$SHA/check-runs?per_page=100" | jq -c '
              [.[].check_runs[] | select(.app.slug == "codecov" and (.name == "codecov/project" or .name == "codecov/patch"))]
              | group_by(.name) | map(max_by(.id))')
            if [[ $(jq '[.[] | select(.status == "completed")] | length' <<<"$checks") == 2 ]]; then
              jq -r '.[] | "\(.name): \(.conclusion) (\(.output.title))"' <<<"$checks"
              failed=$(jq -r '.[] | select(.conclusion != "success" and .conclusion != "neutral") | .name' <<<"$checks")
              if [[ -n "$failed" ]]; then
                echo "::error::Coverage check failed: ${failed//$'\n'/, }. Details are linked in the checks of this pull request."
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Codecov didn't report within 5 minutes, coverage is not checked."

  # Builds the image and runs it the way the Docker MCP Toolkit does, through
  # a profile and the gateway. Needs no Duolingo credentials: the tools are
  # registered without calling the API.
  docker:
    name: Docker
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: github:docker/mcp-gateway

      - name: Install docker mcp plugin
        run: |
          mkdir -p ~/.docker/cli-plugins
          ln -s "$(mise which docker-mcp)" ~/.docker/cli-plugins/docker-mcp
          docker mcp version

      - run: mise run docker-build

      - name: Run the CLI in the image
        run: |
          docker run --rm udondan/duolingo --version
          docker run --rm udondan/duolingo --help

      - run: mise run docker-register ci

      # The gateway only verifies signatures of images under mcp/, and finds
      # the locally built image without pulling it.
      - name: List tools through the gateway
        run: |
          docker mcp gateway run --profile ci --dry-run --verbose 2>&1 | tee gateway.log
          grep -E "duolingo: \([1-9][0-9]* tools\)" gateway.log

  # The only test check the ruleset requires, whatever jobs are added later.
  required:
    needs: [wait-for-turn, ci, coverage, actions, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
