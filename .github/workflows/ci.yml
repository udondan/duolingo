name: CI

on:
  pull_request:
    branches:
      - main
  # Codecov compares pull requests against the coverage of main.
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # All runs share one live Duolingo account. Many parallel runs, for
  # example of several Renovate PRs, would send bursts of requests that look
  # suspicious, so only one run at a time may run the integration tests,
  # including the runs on main.
  boarding-gate:
    name: Queue
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: write # lock refs under refs/boarding-gate/
      pull-requests: read # labels for label-weights
      statuses: write # queue position as commit status
    # Queue order, the concurrency group that cancels outdated waiting runs and
    # the rebase of branches that are behind main: see
    # https://github.com/udondan/boarding-gate#reusable-workflow
    # The rebase needs OVERRIDE_TOKEN: pushes with github.token don't start new runs.
    uses: udondan/boarding-gate/.github/workflows/boarding-gate.yml@v1
    secrets:
      update-token: ${{ secrets.OVERRIDE_TOKEN }}

  # The tests and the Docker job only run if code or build config changed.
  # Skipped outside of pull requests, so pushes to main always run them. Waits
  # for boarding-gate like everything else: while another run holds the turn,
  # this one likely needs a rebase anyway.
  changes:
    needs: boarding-gate
    # Fail instead of skip if boarding-gate failed, see the ci job.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's files via the API
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - src/**
              - tests/**
              - package.json
              - bun.lock
              - mise.toml
              - tsconfig*.json
              - eslint.config.js
              - prettier.config.js
              - vitest.config.ts
              - Dockerfile
              - .dockerignore
              - docker-mcp.yml
              - .github/workflows/ci.yml

  ci:
    name: Lint, typecheck & test
    needs: [boarding-gate, changes]
    # A skipped job counts as passed for required checks. Run the job even if
    # boarding-gate failed and fail it in the first step. Skip it if no code
    # changed.
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.code == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC

    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js and Bun
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: node bun # versions from mise.toml

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test:coverage
        env:
          DUOLINGO_USERNAME: ${{ secrets.DUOLINGO_USERNAME }}
          DUOLINGO_JWT: ${{ secrets.DUOLINGO_JWT }}
          DUOLINGO_TEST_USERNAME: ${{ secrets.DUOLINGO_TEST_USERNAME }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: coverage/lcov.info

      - name: Package dry-run
        run: npm pack --dry-run

  actions:
    needs: boarding-gate
    # Fail instead of skip if boarding-gate failed, see the ci job.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: actionlint shellcheck zizmor

      # Also runs shellcheck over every `run:` block.
      - name: actionlint
        run: actionlint

      - name: zizmor
        run: zizmor .
        env:
          GH_TOKEN: ${{ github.token }} # zizmor checks the actions online

  # Codecov reports its result as the check runs codecov/project and
  # codecov/patch. This job waits for them, so a coverage drop fails the
  # required job. It is skipped along with the tests and passes with a warning
  # if Codecov doesn't report in time.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.ci.result == 'success' }}
    timeout-minutes: 10
    permissions:
      checks: read
    steps:
      - name: Wait for Codecov
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 30); do
            checks=$(gh api --paginate --slurp "repos/$REPO/commits/$SHA/check-runs?per_page=100" | jq -c '
              [.[].check_runs[] | select(.app.slug == "codecov" and (.name == "codecov/project" or .name == "codecov/patch"))]
              | group_by(.name) | map(max_by(.id))')
            if [[ $(jq '[.[] | select(.status == "completed")] | length' <<<"$checks") == 2 ]]; then
              jq -r '.[] | "\(.name): \(.conclusion) (\(.output.title))"' <<<"$checks"
              failed=$(jq -r '.[] | select(.conclusion != "success" and .conclusion != "neutral") | .name' <<<"$checks")
              if [[ -n "$failed" ]]; then
                echo "::error::Coverage check failed: ${failed//$'\n'/, }. Details are linked in the checks of this pull request."
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Codecov didn't report within 5 minutes, coverage is not checked."

  # Builds the image and runs it the way the Docker MCP Toolkit does, through
  # a profile and the gateway. Needs no Duolingo credentials: the tools are
  # registered without calling the API.
  docker:
    name: Docker
    needs: [boarding-gate, changes]
    # Skip if no code changed. Otherwise fail instead of skip if boarding-gate
    # failed, see the ci job.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.result == 'success' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: node bun github:docker/mcp-gateway # versions from mise.toml

      - name: Install docker mcp plugin
        run: |
          mkdir -p ~/.docker/cli-plugins
          ln -s "$(mise which docker-mcp)" ~/.docker/cli-plugins/docker-mcp
          docker mcp version

      # Installs from the lock file (frozen) and compiles dist/ first.
      - run: mise run docker-build

      - name: Run the CLI in the image
        run: |
          docker run --rm udondan/duolingo --version
          docker run --rm udondan/duolingo --help

      - run: mise run docker-register ci

      # The gateway only verifies signatures of images under mcp/, and finds
      # the locally built image without pulling it.
      - name: List tools through the gateway
        run: |
          docker mcp gateway run --profile ci --dry-run --verbose 2>&1 | tee gateway.log
          grep -E "duolingo: \([1-9][0-9]* tools\)" gateway.log

  # Code smells (complexity, duplication, nesting) via Qlty. Git-aware: only
  # smells introduced by the PR compared to main fail the job.
  qlty:
    needs: boarding-gate
    # Fail instead of skip if boarding-gate failed, see the ci job.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install qlty
        uses: qltysh/qlty-action/install@0ff2178667bf8eb28ed0013a7ef54857a24d4056 # v2.7.0

      - name: Lint via qlty plugins
        run: qlty check --all

      - name: Report code smells
        if: github.event_name != 'pull_request'
        run: qlty smells --all --no-snippets

      - name: Report new code smells
        if: github.event_name == 'pull_request'
        run: qlty smells --upstream origin/main --no-snippets

      - name: Fail on new code smells
        if: github.event_name == 'pull_request'
        run: |
          count=$(qlty smells --upstream origin/main --json --quiet 2>/dev/null | jq length)
          if [ "$count" -gt 0 ]; then
            echo "::error::qlty found $count new code smell(s) compared to main"
            exit 1
          fi

  # The only test check the ruleset requires, whatever jobs are added later.
  required:
    needs: [boarding-gate, changes, ci, coverage, actions, docker, qlty]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
